<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Schedule</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
      border-radius: 10px;
    }
    .btn-custom:hover {
      background-color: #0056b3;
    }
    .custom-label {
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="text-center mb-4">Add Availability</h3>
        <form action="/schedules/add" method="post">
          <!-- Day of the Week -->
          <div class="mb-3">
            <label for="dayOfWeek" class="form-label custom-label">Day of the Week</label>
            <select id="dayOfWeek" name="dayOfWeek" class="form-select" required>
              <option value="" disabled selected>Select a day</option>
              <option value="MONDAY">Monday</option>
              <option value="TUESDAY">Tuesday</option>
              <option value="WEDNESDAY">Wednesday</option>
              <option value="THURSDAY">Thursday</option>
              <option value="FRIDAY">Friday</option>
              <option value="SATURDAY">Saturday</option>
              <option value="SUNDAY">Sunday</option>
            </select>
          </div>

          <!-- Start Time -->
          <div class="mb-3">
            <label for="startTime" class="form-label custom-label">Start Time</label>
            <input type="time" id="startTime" name="startTime" class="form-control" required>
          </div>

          <!-- Doctor ID -->
          <div class="mb-3">
            <label for="doctorId" class="form-label custom-label">Doctor ID</label>
            <input type="number" id="doctorId" name="doctorId" class="form-control" placeholder="Enter your ID" required>
          </div>

          <!-- Add Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-custom px-4">Add Schedule</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
