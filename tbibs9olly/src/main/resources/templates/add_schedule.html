<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Schedule</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #f8f9fa;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      background-color: #212529;
      color: white;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .RAZZI {
      font-size: 1.5rem;
      margin: 10px 0 20px;
      font-weight: bold;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 8px;
      background: linear-gradient(135deg, #007bff, #6f42c1);
      transition: all 0.3s ease;
    }
    .RAZZI:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #6f42c1, #007bff);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }
    .sidebar a {
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 1rem;
      margin: 5px 0;
      border-radius: 5px;
      text-align: center;
      width: 90%;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .navbar {
      background-color: #343a40;
      padding: 10px 20px;
      position: fixed;
      top: 0;
      left: 240px;
      right: 0;
      width: calc(100% - 240px);
      z-index: 1030;
    }
    .content {
      margin-top: 56px;
      margin-left: 240px;
      padding: 20px;
    }
    .navbar .navbar-brand {
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .navbar .nav-link {
      color: white;
      font-size: 1rem;
      margin: 0 10px;
    }
    .navbar .nav-link:hover {
      color: #adb5bd;
    }
    .navbar .btn {
      font-size: 0.9rem;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
  <a th:href="@{/doctor/dashboard}" class="RAZZI">Doctor Dashboard</a>
  <a class="dropdown-item" th:href="@{/doctor/schedules/add/{doctorId}(doctorId=${doctorId})}">Add Schedule</a>
  <a class="dropdown-item" th:href="@{/doctor/schedules/doctor/{doctorId}(doctorId=${doctorId})}">View Schedules</a>
  <a th:href="@{/doctor/patient}">Patients</a>
  <a href="#payments">Payments</a>
  <a href="#settings">Settings</a>
</div>

<!-- Main Content -->
<div class="content">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="modal" data-bs-target="#profileModal">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-outline-light btn-sm" href="#logout">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white text-center">
            <h2 class="h5 mb-0">Add Schedule</h2>
          </div>
          <div class="card-body">
            <p class="text-center mb-4"><strong>Doctor ID:</strong> <span th:text="${doctorId}"></span></p>

            <form th:action="@{'/doctor/schedules/add/' + ${doctorId}}" method="post">
              <input type="hidden" name="doctorId" value="${doctorId}" />

              <!-- Month Dropdown -->
              <div class="mb-3">
                <label for="month" class="form-label">Month</label>
                <select class="form-select" name="month" id="month" required onchange="updateDays()">
                  <option value="" disabled selected>Select a month</option>
                  <option value="1">January</option>
                  <option value="2">February</option>
                  <option value="3">March</option>
                  <option value="4">April</option>
                  <option value="5">May</option>
                  <option value="6">June</option>
                  <option value="7">July</option>
                  <option value="8">August</option>
                  <option value="9">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>

              <!-- Day of Month Dropdown -->
              <div class="mb-3">
                <label for="dayOfMonth" class="form-label">Day of Month</label>
                <select class="form-select" name="dayOfMonth" id="dayOfMonth" required>
                  <!-- Days will be dynamically populated -->
                </select>
              </div>

              <div class="mb-3">
                <label for="startTime" class="form-label">Start Time</label>
                <input type="time" class="form-control" id="startTime" name="startTime" required>
              </div>

              <button type="submit" class="btn btn-success w-100">Add Schedule</button>

              <div th:if="${error}" class="alert alert-danger mt-3">${error}</div>
            </form>
          </div>
          <div class="card-footer text-center bg-light">
            <a th:href="@{'/doctor/schedules/doctor/' + ${doctorId}}" class="btn btn-link">Back to Doctor's Schedule</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function updateDays() {
    const month = document.getElementById('month').value;
    const daySelect = document.getElementById('dayOfMonth');

    // Clear the current options
    daySelect.innerHTML = '';

    // Get the number of days in the selected month
    let daysInMonth = 31;
    if (month == '2') {
      // Check if it's a leap year
      const year = new Date().getFullYear();
      daysInMonth = (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 29 : 28; // Leap year check
    } else if (['4', '6', '9', '11'].includes(month)) {
      daysInMonth = 30;
    }

    // Populate day dropdown
    for (let day = 1; day <= daysInMonth; day++) {
      const option = document.createElement('option');
      option.value = day;
      option.textContent = day;
      daySelect.appendChild(option);
    }
  }
</script>

</body>
</html>
