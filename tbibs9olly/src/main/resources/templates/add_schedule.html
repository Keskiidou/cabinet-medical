<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Schedule</title>
</head>
<body>
<h1>Add Schedule</h1>

<p>Doctor ID: <span th:text="${doctorId}"></span></p>
<form th:action="@{'/doctor/schedules/add/' + ${doctorId}}" method="post">
  <input type="hidden" name="doctorId" value="${doctorId}" />

  <label for="dayOfWeek">Day of Week:</label>
  <select name="dayOfWeek" id="dayOfWeek" required>
    <option value="MONDAY">Monday</option>
    <option value="TUESDAY">Tuesday</option>
    <option value="WEDNESDAY">Wednesday</option>
    <option value="THURSDAY">Thursday</option>
    <option value="FRIDAY">Friday</option>
    <option value="SATURDAY">Saturday</option>
    <option value="SUNDAY">Sunday</option>
  </select>

  <label for="startTime">Start Time:</label>
  <input type="time" id="startTime" name="startTime" required>

  <button type="submit">Add Schedule</button>

  <div th:if="${error}" style="color: red;">${error}</div>
</form>

<p><a href="/doctor/schedules/doctor/${doctorId}">Back to Doctor's Schedule</a></p>
</body>
</html>
