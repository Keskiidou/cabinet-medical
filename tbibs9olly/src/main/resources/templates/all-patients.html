<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>All Patients</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #f8f9fa;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      background-color: #212529;
      color: white;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .RAZZI {
      font-size: 1.5rem;
      margin: 10px 0 20px;
      font-weight: bold;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 8px;
      background: linear-gradient(135deg, #007bff, #6f42c1);
      transition: all 0.3s ease;
    }
    .RAZZI:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #6f42c1, #007bff);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }
    .sidebar a {
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 1rem;
      margin: 5px 0;
      border-radius: 5px;
      text-align: center;
      width: 90%;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .navbar {
      background-color: #343a40;
      padding: 10px 20px;
      position: fixed;
      top: 0;
      left: 240px; /* Adjust to align with the sidebar */
      right: 0;
      width: calc(100% - 240px); /* Ensures navbar takes the remaining space */
      z-index: 1030;
    }
    .content {
      margin-top: 56px;
      margin-left: 240px;
      padding: 20px;
    }
    .navbar .navbar-brand {
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .navbar .nav-link {
      color: white;
      font-size: 1rem;
      margin: 0 10px;
    }
    .navbar .nav-link:hover {
      color: #adb5bd;
    }
    .navbar .btn {
      font-size: 0.9rem;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <a th:href="@{/doctor/dashboard}" class="RAZZI">Doctor Dashboard</a>
  <a class="dropdown-item" th:href="@{/doctor/schedules/add/{doctorId}(doctorId=${doctorId})}">Add Schedule</a>
  <a class="dropdown-item" th:href="@{/doctor/schedules/doctor/{doctorId}(doctorId=${doctorId})}">View Schedules</a>
  <a th:href="@{/doctor/patient}">Patients</a>
  <a href="#payments">Payments</a>
  <a href="#settings">Settings</a>
</div>

<!-- Main Content -->
<div class="content">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="modal" data-bs-target="#profileModal">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-outline-light btn-sm" th:href="@{/doctor/logout}">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h1 class="mb-4">Patient List</h1>
    <p class="text-center mb-4"><strong>Doctor ID:</strong> <span th:text="${doctorId}"></span></p>
    <!-- Search Form -->
    <form th:action="@{/doctor/patient}" method="get" class="mb-4">
      <div class="input-group">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name...">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <!-- Patient Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Gender</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Symptoms</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="patient, iterStat : ${patients}">
          <td th:text="${iterStat.index + 1}"></td>
          <td th:text="${patient.name}"></td>
          <td th:text="${patient.email}"></td>
          <td th:text="${patient.gender}"></td>
          <td th:text="${patient.phone}"></td>
          <td th:text="${patient.address}"></td>
          <td th:text="${patient.symptoms}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${pages.length > 0}">
      <ul class="pagination">
        <li class="page-item" th:classappend="${page == 0 ? 'disabled' : ''}">
          <a class="page-link" th:href="@{/doctor/patient(page=${page - 1}, keyword=${keyword})}">Previous</a>
        </li>
        <li class="page-item" th:each="i : ${pages}" th:classappend="${i == page ? 'active' : ''}">
          <a class="page-link" th:href="@{/doctor/patient(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${page == pages.length - 1 ? 'disabled' : ''}">
          <a class="page-link" th:href="@{/doctor/patient(page=${page + 1}, keyword=${keyword})}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
