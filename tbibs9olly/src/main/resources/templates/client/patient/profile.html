<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Your Profile</h1>

    <!-- Success message after profile update -->
    <div class="alert alert-success" th:if="${successMessage}" style="display: block;">
        Profile updated successfully!
    </div>

    <!-- Profile details (read-only) -->
    <form th:action="@{/profile}" method="post" disabled>
        <!-- Patient's name -->
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${patient.name}" readonly>
        </div>

        <!-- Patient's email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${patient.email}" readonly>
        </div>

        <!-- Patient's password -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" class="form-control" id="password" name="password" th:value="${patient.password}" readonly>
        </div>

        <!-- Patient's phone number -->
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text" class="form-control" id="phone" name="phone" th:value="${patient.phone}" readonly>
        </div>

        <!-- Patient's address -->
        <div class="form-group">
            <label for="address">Address:</label>
            <textarea class="form-control" id="address" name="address" rows="3" readonly th:text="${patient.address}"></textarea>
        </div>
    </form>

    <!-- Back to home button -->
    <div class="mt-3">
        <a th:href="@{/index}" class="btn btn-secondary">Back to Home</a>
    </div>
    <div class="mt-3">
        <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
    </div>
</div>

</body>
</html>
