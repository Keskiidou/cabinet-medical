<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAZZI - Book an Appointment</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .appointment-header {
            background-color: #007bff;
            color: #fff;
            padding: 50px 0;
            text-align: center;
        }
        .form-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            margin-top: -50px;
        }
        .btn-submit {
            background-color: #007bff;
            color: #fff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/index">RAZZI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/index">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/appointments">Appointments</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="appointment-header">
    <h1>Book Your Appointment</h1>
    <p>Choose a date and time that works for you</p>
</header>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-container">
                <form th:action="@{/book}" th:object="${appointment}" method="post">
                    <div class="mb-4">
                        <label for="doctor" class="form-label">Doctor</label>
                        <input type="hidden" id="doctor" name="doctor" class="form-control" hidden>
                    </div>
                    <input type="hidden" id="schedule" name="schedule.id" th:field="*{schedule.id}">
                    <div class="mb-4">
                        <label for="patientName" class="form-label">Full Name</label>
                        <input type="text" id="patientName" th:field="*{patientName}" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label for="message" class="form-label">Symptoms</label>
                        <textarea id="message" th:field="*{message}" class="form-control"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-submit">Book Appointment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5">
    <p>&copy; 2025 RAZZI</p>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const doctorName = localStorage.getItem('selectedDoctorName');
        const scheduleId = localStorage.getItem('selectedScheduleId');

        if (doctorName && scheduleId) {
            document.getElementById('doctor').value = doctorName;
            document.getElementById('schedule').value = scheduleId;
        } else {
            alert('Error: Missing doctor or schedule information.');
        }
    });
</script>
<script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
