<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAZZI - Book an Appointment</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .appointment-header {
            background-color: #007bff;
            color: #fff;
            padding: 50px 0;
            text-align: center;
        }

        .appointment-header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .appointment-header p {
            font-size: 1.2rem;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: -50px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .btn-submit {
            background-color: #007bff;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 15px 0;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/index">RAZZI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/index">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/appointments">Appointments</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Header -->
<header class="appointment-header">
    <div class="container">
        <h1>Book Your Appointment</h1>
        <p>Choose a date and time that works for you</p>
    </div>
</header>

<!-- Appointment Form -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-container">
                <form th:action="@{/appointments/book}" method="post">
                    <!-- Patient Name -->
                    <div class="mb-4">
                        <label for="patientName" class="form-label">Full Name</label>
                        <input type="text" id="patientName" name="patientName" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-4">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
                    </div>

                    <!-- Appointment Month, Day, and Time -->
                    <div class="mb-4 form-row">
                        <!-- Month -->
                        <div class="form-group">
                            <label for="month" class="form-label">Month</label>
                            <select id="month" name="month" class="form-select" required>
                                <option value="" disabled selected>Select Month</option>
                                <option value="01">January</option>
                                <option value="02">February</option>
                                <option value="03">March</option>
                                <option value="04">April</option>
                                <option value="05">May</option>
                                <option value="06">June</option>
                                <option value="07">July</option>
                                <option value="08">August</option>
                                <option value="09">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                        </div>

                        <!-- Day -->
                        <div class="form-group">
                            <label for="day" class="form-label">Day</label>
                            <select id="day" name="day" class="form-select" required>
                                <option value="" disabled selected>Select Day</option>
                                <!-- Days will be populated dynamically based on selected month -->
                            </select>
                        </div>

                        <!-- Time -->
                        <div class="form-group">
                            <label for="time" class="form-label">Time</label>
                            <select id="time" name="time" class="form-select" required>
                                <option value="" disabled selected>Select Time</option>
                                <option value="09:00">09:00 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="01:00">01:00 PM</option>
                                <option value="02:00">02:00 PM</option>
                                <option value="03:00">03:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <!-- Doctor Selection -->
                    <div class="mb-4">
                        <label for="doctor" class="form-label">Select Doctor</label>
                        <select id="doctor" name="doctor" class="form-select" required>
                            <option value="" disabled selected>Select a doctor</option>
                            <option value="Dr. John Doe">Dr. John Doe - Cardiology</option>
                            <option value="Dr. Jane Smith">Dr. Jane Smith - Dermatology</option>
                        </select>
                    </div>

                    <!-- Message -->
                    <div class="mb-4">
                        <label for="message" class="form-label">Additional Notes</label>
                        <textarea id="message" name="message" class="form-control" rows="3" placeholder="Enter any additional details or requests"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-submit">Book Appointment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-1">&copy; 2025 RAZZI - All Rights Reserved</p>
        <small>Powered by <a href="https://spring.io/" target="_blank">Spring Boot</a> & <a href="https://www.thymeleaf.org/" target="_blank">Thymeleaf</a></small>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS to populate days based on month -->
<script>
    document.getElementById('month').addEventListener('change', function () {
        const month = this.value;
        const daySelect = document.getElementById('day');
        daySelect.innerHTML = ''; // Clear current options

        let daysInMonth;
        if (month === '02') {  // February (28 or 29 days)
            daysInMonth = 28;  // Assuming no leap year logic for simplicity
        } else if (['04', '06', '09', '11'].includes(month)) {  // April, June, September, November
            daysInMonth = 30;
        } else {  // All other months
            daysInMonth = 31;
        }

        // Populate day options
        for (let day = 1; day <= daysInMonth; day++) {
            const option = document.createElement('option');
            option.value = day < 10 ? `0${day}` : day;
            option.textContent = day;
            daySelect.appendChild(option);
        }
    });
</script>
</body>
</html>
