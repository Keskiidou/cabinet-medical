<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="patients.html">
<head>
  <meta charset="UTF-8">
  <title>New Doctor</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="/webjars/bootstrap-icons/1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div layout:fragment="content">
  <div class="container p-3">
    <div class="card">
      <div class="card-header">Adding New Doctor</div>
      <div class="card-body">
        <form th:action="@{/ADD}" th:object="${doctor}" method="post">
          <!-- Name Field -->
          <div class="mb-3 mt-3">
            <label for="name" class="form-label">Name</label>
            <input class="form-control" type="text" id="name" th:field="*{name}" placeholder="Enter doctor's name" required>
          </div>

          <!-- Specialization Field -->
          <div class="mb-3 mt-3">
            <label for="specialization" class="form-label">Specialization</label>
            <input class="form-control" type="text" id="specialization" th:field="*{specialization}" placeholder="Enter specialization" required>
          </div>

          <!-- Email Field -->
          <div class="mb-3 mt-3">
            <label for="email" class="form-label">Email</label>
            <input class="form-control" type="email" id="email" th:field="*{email}" placeholder="Enter email" required>
          </div>

          <!-- Phone Field -->
          <div class="mb-3 mt-3">
            <label for="phone" class="form-label">Phone</label>
            <input class="form-control" type="text" id="phone" th:field="*{phone}" placeholder="Enter phone number" required>
          </div>

          <!-- Address Field -->
          <div class="mb-3 mt-3">
            <label for="address" class="form-label">Address</label>
            <input class="form-control" type="text" id="address" th:field="*{address}" placeholder="Enter address" required>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Add Doctor
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
